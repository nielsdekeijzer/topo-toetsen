<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-title" content="Topo-toetsen">
<title>Topografie-toetsen</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    background: #1e3a5f; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px calc(40px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 28px; margin: 0 0 6px; text-align: center; }
  p { margin: 0 0 28px; opacity: .8; text-align: center; }
  nav { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 420px; }
  nav a {
    display: block; text-decoration: none; color: #fff; background: #c2410c;
    font-size: 20px; font-weight: 700; padding: 18px 22px; border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  nav a:nth-child(3n+2) { background: #16a34a; }
  nav a:nth-child(3n+3) { background: #0369a1; }
  nav a:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  nav a small { display: block; font-size: 14px; font-weight: 500; opacity: .85; margin-top: 4px; }
</style>
</head>
<body>
  <h1>🗺️ Topografie-toetsen</h1>
  <p>Kies een toets om te oefenen</p>
  <nav id="toetsen"></nav>

<script>
// Nieuwe toets? Voeg hier een regel toe (nieuwste bovenaan).
const TOETSEN = [
  { bestand: 'topografie-australie-oceanie.html', titel: '🦘 Australië & Oceanië', items: 17 },
  { bestand: 'topografie-oost-azie.html',         titel: '🐼 Oost-Azië',           items: 20 },
];

const nav = document.getElementById('toetsen');
TOETSEN.forEach(t => {
  const a = document.createElement('a');
  a.href = t.bestand;
  a.textContent = t.titel;
  const s = document.createElement('small');
  s.textContent = `${t.items} plaatsen, landen en gebieden`;
  a.appendChild(s);
  nav.appendChild(a);
});
</script>
</body>
</html>
